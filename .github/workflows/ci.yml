name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --features ui -- -D warnings
      - run: cargo clippy --all-targets --features client -- -D warnings
      - run: cargo test
      - run: cargo test --features ui
      - run: cargo test --features client
      - run: cargo test --all-features
      - run: cargo check --target wasm32-unknown-unknown --features ui
